spring.application.name=example
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6380}

example.chat.model=${CHAT_MODEL:gpt-4o-mini}

com.anordine.simplifier.webflux.ai.open-ai.autoconfigure=true
com.anordine.simplifier.webflux.ai.open-ai.secret-key=${OPENAI_API_KEY:example-openai-key}

com.anordine.simplifier.webflux.ai.open-router.autoconfigure=true
com.anordine.simplifier.webflux.ai.open-router.secret-key=${OPENROUTER_API_KEY:example-openrouter-key}

com.anordine.simplifier.webflux.ai.deepseek.autoconfigure=true
com.anordine.simplifier.webflux.ai.deepseek.secret-key=${DEEPSEEK_API_KEY:example-deepseek-key}

com.anordine.simplifier.webflux.ai.history.autoconfigure=true
com.anordine.simplifier.webflux.ai.history.mode=redis
com.anordine.simplifier.webflux.ai.history.redis.prefix=simplifier-webflux-ai:example:history

com.anordine.simplifier.webflux.ai.sse.autoconfigure=true
com.anordine.simplifier.webflux.ai.sse.heartbeat-every=30s
com.anordine.simplifier.webflux.ai.sse.typing-every=3s
com.anordine.simplifier.webflux.ai.sse.max-back-pressure=256
com.anordine.simplifier.webflux.ai.sse.emit-usage-events=true
