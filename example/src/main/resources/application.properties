spring.application.name=example

# Keep provider clients disabled by default so the example starts without secrets.
# Set OPENAI_API_KEY and flip this to true to create the openAiWebClient bean.
anordine.completions-api-webflux.open-ai.autoconfigure=false
anordine.completions-api-webflux.open-ai.secret-key=${OPENAI_API_KEY:}
