spring.application.name=example
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

example.chat.model=${CHAT_MODEL:gpt-4o-mini}

anordine.completions-api-webflux.open-ai.autoconfigure=true
anordine.completions-api-webflux.open-ai.secret-key=${OPENAI_API_KEY:example-openai-key}

anordine.completions-api-webflux.open-router.autoconfigure=true
anordine.completions-api-webflux.open-router.secret-key=${OPENROUTER_API_KEY:example-openrouter-key}

anordine.completions-api-webflux.history.autoconfigure=true
anordine.completions-api-webflux.history.mode=redis
anordine.completions-api-webflux.history.redis.host=${REDIS_HOST:127.0.0.1}
anordine.completions-api-webflux.history.redis.port=${REDIS_PORT:6380}
anordine.completions-api-webflux.history.redis.prefix=completions-api-webflux:example:history
anordine.completions-api-webflux.history.redis.autoconfigure-serializers=true

anordine.completions-api-webflux.sse.autoconfigure=true
anordine.completions-api-webflux.sse.heartbeat-every=30s
anordine.completions-api-webflux.sse.typing-every=3s
anordine.completions-api-webflux.sse.max-back-pressure=256
anordine.completions-api-webflux.sse.emit-usage-events=true
