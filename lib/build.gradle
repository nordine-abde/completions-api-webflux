 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/9.4.1/userguide/building_java_projects.html in the Gradle documentation.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.spring.dependency.management)
}

group = providers.gradleProperty('libraryGroup').orElse('com.anordine').get()
version = providers.gradleProperty('libraryVersion').orElse('0.1.0-SNAPSHOT').get()

base {
    archivesName = 'simplifier-webflux-ai'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom libs.spring.boot.dependencies.get().toString()
    }
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher

    api libs.spring.webflux
    api libs.spring.redis
    implementation libs.jsonschema.generator
    implementation libs.jsonschema.module.jackson
}

java {
    withSourcesJar()
    withJavadocJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('redisIntegrationTest', Test) {
    description = 'Runs Redis-backed integration tests. Start compose.redis-test.yml first.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()

    include '**/InRedisHistoryManagerTest.class'
    environment 'REDIS_INTEGRATION_TESTS', 'true'
}

tasks.withType(org.gradle.api.publish.maven.tasks.GenerateMavenPom).configureEach {
    notCompatibleWithConfigurationCache('Maven POM generation captures Gradle model objects in this build.')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            artifactId = 'simplifier-webflux-ai'

            pom {
                name = 'simplifier-webflux-ai'
                description = 'AI Chat Completions DTOs and WebFlux helpers for Spring applications'
                url = 'https://github.com/nordine-abde/simplifier-webflux-ai'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/nordine-abde/simplifier-webflux-ai/blob/main/LICENSE'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/nordine-abde/simplifier-webflux-ai.git'
                    developerConnection = 'scm:git:ssh://git@github.com:nordine-abde/simplifier-webflux-ai.git'
                    url = 'https://github.com/nordine-abde/simplifier-webflux-ai'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            def owner = providers.gradleProperty('githubPackagesOwner')
                    .orElse(System.getenv('GITHUB_REPOSITORY_OWNER') ?: 'nordine-abde')
                    .get()
            def repository = providers.gradleProperty('githubPackagesRepository')
                    .orElse('simplifier-webflux-ai')
                    .get()
            url = uri("https://maven.pkg.github.com/${owner}/${repository}")

            credentials {
                username = providers.gradleProperty('gpr.user')
                        .orElse(System.getenv('GITHUB_ACTOR') ?: System.getenv('USERNAME') ?: '')
                        .get()
                password = providers.gradleProperty('gpr.key')
                        .orElse(System.getenv('GITHUB_TOKEN') ?: System.getenv('TOKEN') ?: '')
                        .get()
            }
        }
    }
}
