plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

group = 'com.anordine'
version = '0.1.0-SNAPSHOT'

base {
    archivesName = 'completions-api-webflux'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    api libs.spring.webflux
    api libs.spring.redis
    implementation 'com.github.victools:jsonschema-generator:4.38.0'
    implementation 'com.github.victools:jsonschema-module-jackson:4.38.0'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.register('redisIntegrationTest', Test) {
    description = 'Runs Redis-backed integration tests. Start compose.redis-test.yml first.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()

    include '**/InRedisHistoryManagerTest.class'
    environment 'REDIS_INTEGRATION_TESTS', 'true'
}
