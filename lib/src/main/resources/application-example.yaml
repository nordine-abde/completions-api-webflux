# Copy only the entries you need into your own application.yaml or application.properties.
# Set `<provider>.autoconfigure` to `true` to create that provider's WebClient bean.
# Set `<provider>.secret-key` to the API key used as a Bearer token.
#
# Built-in bean names:
# - openAiWebClient
# - groqWebClient
# - geminiWebClient
# - openRouterWebClient
# - claudeWebClient
# - deepSeekWebClient
#
# Custom clients are declared under `custom.<name>`.
# `<name>` is converted to camelCase for the bean name:
# - `local-llm` -> `localLlm`
# - `partner-gateway` -> `partnerGateway`
# Each custom client needs:
# - `autoconfigure`: whether the bean should be created
# - `base-url`: the OpenAI-compatible API base URL
# - `secret-key`: the Bearer token to send
#
# History manager autoconfiguration is also opt-in and requires explicitly
# importing `HistoryConfiguration`.
# Defaults:
# - `history.autoconfigure`: false
# - `history.mode`: memory
# - `history.redis.prefix`: simplifier-webflux-ai:history
# For Postgres-backed persistent history with Redis cache, define an
# `InRedisPostgresHistoryManager` bean manually and provide mapper, retrieve,
# and save functions for your entity/repository.
#
# SSE manager autoconfiguration is also opt-in and requires explicitly
# importing `SseConfiguration`.
# Defaults:
# - `sse.autoconfigure`: false
# - `sse.heartbeat-every`: 30s
# - `sse.typing-every`: 3s
# - `sse.max-back-pressure`: 256
# - `sse.emit-usage-events`: true
com:
  anordine:
    simplifier:
      webflux:
        ai:
          sse:
            autoconfigure: false
            heartbeat-every: 30s
            typing-every: 3s
            max-back-pressure: 256
            emit-usage-events: true
          history:
            autoconfigure: false
            mode: memory
            redis:
              prefix: simplifier-webflux-ai:history
          open-ai:
            autoconfigure: true
            secret-key: OPEN_AI_SECRET
          groq:
            autoconfigure: true
            secret-key: GROQ_SECRET
          gemini:
            autoconfigure: true
            secret-key: GEMINI_SECRET
          open-router:
            autoconfigure: true
            secret-key: OPEN_ROUTER_SECRET
          claude:
            autoconfigure: true
            secret-key: CLAUDE_SECRET
          deepseek:
            autoconfigure: true
            secret-key: DEEPSEEK_SECRET
          custom:
            # Creates a bean named `localLlm`
            local-llm:
              autoconfigure: true
              base-url: http://localhost:1234/v1
              secret-key: LOCAL_SECRET
            # Creates a bean named `partnerGateway`
            partner-gateway:
              autoconfigure: true
              base-url: https://partner.example.com/openai/v1
              secret-key: PARTNER_SECRET
